<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Lets Track It</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f4b8.png">
    
    <!-- Tailwind CDN with custom brand color palette -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              midnight: '#02070A',
              'midnight-dark': '#010406',
              'midnight-surface': '#06131D',
              'midnight-card': '#091A27',
              'midnight-subtle': '#0E2436',
              'midnight-border': '#15354F',
              electric: '#0297DE',
              'electric-hover': '#0284C7',
              'electric-glow': 'rgba(2, 151, 222, 0.25)',
              cantaloupe: '#FC734D',
              'cantaloupe-hover': '#F95C30',
              'cantaloupe-glow': 'rgba(252, 115, 77, 0.25)',
              'clean-white': '#FCFFFF',
              'soft-grey': '#F1F5F9',
              income: '#0297DE',
              'income-glow': 'rgba(2, 151, 222, 0.25)',
              expense: '#FC734D',
              'expense-glow': 'rgba(252, 115, 77, 0.25)',
            },
            fontFamily: {
              sans: ['Outfit', 'system-ui', 'sans-serif'],
            }
          }
        }
      };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
      
      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        
        /* Dark Mode (Default) - Midnight Black + Electric Blue + Cantaloupe Orange */
        --bg-main: #02070A;
        --bg-card: #081622;
        --bg-secondary: #0D2235;
        --bg-input: #050E17;
        --border-color: #143652;
        --text-main: #FCFFFF;
        --text-muted: #8397AB;
        
        --brand-midnight: #02070A;
        --brand-electric: #0297DE;
        --brand-cantaloupe: #FC734D;
        --brand-income: #0297DE;
        --brand-expense: #FC734D;
      }

      body.light-mode {
        /* Light Mode - Soft Slate & Crisp White with Brand Accents */
        --bg-main: #F4F7FA;
        --bg-card: #FFFFFF;
        --bg-secondary: #E8EFF6;
        --bg-input: #FFFFFF;
        --border-color: #CBD8E6;
        --text-main: #02070A;
        --text-muted: #536B82;
        
        --brand-midnight: #02070A;
        --brand-electric: #0297DE;
        --brand-cantaloupe: #FC734D;
        --brand-income: #0297DE;
        --brand-expense: #FC734D;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: 'Outfit', sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        overscroll-behavior-y: none;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      input, textarea, [contenteditable], select {
        user-select: text;
      }

      /* Custom Scrollbar for sleek fintech look */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(2, 151, 222, 0.35);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(252, 115, 77, 0.55);
      }
      
      /* Glassmorphism Fintech Cards & Panels */
      .glass-card {
        background: rgba(8, 22, 34, 0.78);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(2, 151, 222, 0.2);
        box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      body.light-mode .glass-card {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(2, 151, 222, 0.15);
        box-shadow: 0 10px 35px -5px rgba(2, 7, 10, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .glass-header {
        background: rgba(2, 7, 10, 0.88);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border-bottom: 1px solid rgba(2, 151, 222, 0.18);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }

      body.light-mode .glass-header {
        background: rgba(244, 247, 250, 0.9);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(203, 216, 230, 0.6);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      }

      .glass-pill {
        background: rgba(2, 151, 222, 0.12);
        border: 1px solid rgba(2, 151, 222, 0.3);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .glass-pill-orange {
        background: rgba(252, 115, 77, 0.12);
        border: 1px solid rgba(252, 115, 77, 0.3);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .dashboard-card {
        border-radius: 24px;
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, border-color 0.3s ease;
      }
      .dashboard-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 16px 40px -10px rgba(2, 151, 222, 0.2);
      }

      /* Ambient Glow Backgrounds with Parallax Motion */
      .bg-glow-orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(120px);
        pointer-events: none;
        z-index: 0;
        opacity: 0.18;
        transition: transform 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
        will-change: transform;
      }

      body.light-mode .bg-glow-orb {
        opacity: 0.08;
        filter: blur(140px);
      }

      @keyframes floatGlow {
        0% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(35px, -25px) scale(1.06); }
        100% { transform: translate(-25px, 30px) scale(0.96); }
      }

      /* Dynamic Scroll Indicator */
      .scroll-progress-line {
        position: fixed;
        top: 0;
        left: 0;
        height: 3px;
        background: linear-gradient(90deg, #FC734D, #0297DE, #FC734D);
        box-shadow: 0 0 12px #FC734D, 0 0 24px rgba(2, 151, 222, 0.5);
        z-index: 999;
        transition: width 0.15s cubic-bezier(0.1, 0.9, 0.2, 1);
      }

      /* Floating Scroll Movement Effects */
      .scroll-float-slow {
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: transform;
      }

      .fintech-glow-electric {
        box-shadow: 0 0 30px rgba(2, 151, 222, 0.25);
      }

      .fintech-glow-orange {
        box-shadow: 0 0 25px rgba(252, 115, 77, 0.25);
      }

      .fintech-glow-income {
        box-shadow: 0 0 25px rgba(2, 151, 222, 0.22);
      }

      .fintech-glow-expense {
        box-shadow: 0 0 25px rgba(252, 115, 77, 0.22);
      }

      /* Custom Smooth Scrollbar */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(2, 151, 222, 0.35) transparent;
      }

      /* Ink-Friendly Clean Print Stylesheet */
      @media print {
        body, html {
          background: #FFFFFF !important;
          color: #0A0F1D !important;
          font-size: 11pt !important;
        }
        .no-print, header, nav, aside, .bottom-bar, .bg-glow-orb, .scroll-progress-line, button.no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
        .glass-card, .dashboard-card {
          background: #FFFFFF !important;
          border: 1px solid #CBD5E1 !important;
          box-shadow: none !important;
          backdrop-filter: none !important;
          color: #0F172A !important;
          page-break-inside: avoid;
        }
        table {
          width: 100% !important;
          border-collapse: collapse !important;
        }
        th, td {
          border: 1px solid #CBD5E1 !important;
          color: #0F172A !important;
          padding: 8px 12px !important;
        }
        th {
          background-color: #F1F5F9 !important;
          font-weight: 700 !important;
        }
        @page {
          size: A4 portrait;
          margin: 15mm 15mm 15mm 15mm;
        }
      }
    </style>

{
  "imports": {

}
</script>
</head>

    <div id="root"></div>

  </body>
</html>
