name: "Automated All-Tests Suite & Excel Reports Delivery"

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      load_test_duration:
        description: 'Baseline Load Test Duration in seconds (e.g. 10 for quick CI, 60 for 1-minute full benchmark)'
        required: false
        default: '60'
      virtual_users:
        description: 'Number of Concurrent Virtual Users (VUs) for Load Test'
        required: false
        default: '100'

permissions:
  contents: read
  actions: read

jobs:
  run-all-tests-and-export:
    name: "Execute 4 Automated Test Suites & Collect Excel Reports"
    runs-on: ubuntu-latest

    steps:
      - name: "1. Checkout Source Code"
        uses: actions/checkout@v4

      - name: "2. Set up Node.js 20.x Environment"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: "3. Install Project Dependencies"
        run: |
          echo "=========================================================="
          echo "📦 INSTALLING DEPENDENCIES"
          echo "=========================================================="
          npm install --legacy-peer-deps
          npm install xlsx --legacy-peer-deps --no-save || true

      # =======================================================================
      # TEST 1: SELENIUM WEB FRONTEND E2E TEST SUITE
      # =======================================================================
      - name: "4. Run Test 1: Selenium Web Frontend E2E Suite"
        id: test-selenium
        run: |
          echo "=========================================================="
          echo "🌐 EXECUTING TEST 1: SELENIUM WEB E2E TEST SUITE"
          echo "=========================================================="
          node selenium-tests/tests/login-tests.js
          ls -la selenium-tests/*.xlsx

      # =======================================================================
      # TEST 2: APPIUM MOBILE APP E2E TEST SUITE
      # =======================================================================
      - name: "5. Run Test 2: Appium Mobile App E2E Suite"
        id: test-appium
        run: |
          echo "=========================================================="
          echo "📱 EXECUTING TEST 2: APPIUM MOBILE E2E TEST SUITE"
          echo "=========================================================="
          node appium-tests/tests/mobile-e2e-tests.js
          ls -la appium-tests/*.xlsx

      # =======================================================================
      # TEST 3: BASELINE & CONCURRENCY LOAD TESTING
      # =======================================================================
      - name: "6. Run Test 3: Baseline Concurrency Load Test (100 VUs)"
        id: test-load
        run: |
          echo "=========================================================="
          echo "⚡ EXECUTING TEST 3: BASELINE CONCURRENCY LOAD TEST"
          echo "=========================================================="
          DURATION="${{ github.event.inputs.load_test_duration || '60' }}"
          VUS="${{ github.event.inputs.virtual_users || '100' }}"
          echo "Running with $VUS Virtual Users for $DURATION seconds..."
          node load-tests/baseline-load-test.js --vus=$VUS --duration=$DURATION
          ls -la load-tests/*.xlsx

      # =======================================================================
      # TEST 4: APPLICATION SECURITY & DEVSECOPS AUDIT
      # =======================================================================
      - name: "7. Run Test 4: Application Security & DevSecOps Audit"
        id: test-security
        run: |
          echo "=========================================================="
          echo "🛡️ EXECUTING TEST 4: DEVSECOPS SECURITY & SAST/DAST AUDIT"
          echo "=========================================================="
          node scripts/security/sast-scanner.js || true
          node scripts/security/generate-security-excel.js
          ls -la "Vulnerability Test Results"/*.xlsx

      # =======================================================================
      # STAGE DOWNLOADABLE EXCEL REPORTS
      # =======================================================================
      - name: "8. Consolidate All Test Excel Reports for Download"
        id: consolidate-reports
        run: |
          echo "=========================================================="
          echo "📁 CONSOLIDATING ALL EXCEL REPORTS INTO DOWNLOAD DIRECTORY"
          echo "=========================================================="
          mkdir -p test-excel-reports

          # Copy and standardize file names for easy navigation
          cp selenium-tests/Selenium_Login_E2E_Test_Report.xlsx test-excel-reports/1_Selenium_Login_E2E_Test_Report.xlsx
          cp appium-tests/Appium_Mobile_E2E_Test_Report.xlsx test-excel-reports/2_Appium_Mobile_E2E_Test_Report.xlsx
          cp load-tests/Baseline_Load_Test_Report.xlsx test-excel-reports/3_Baseline_Load_Test_Report.xlsx
          cp "Vulnerability Test Results/findings.xlsx" test-excel-reports/4_Security_Vulnerability_Findings.xlsx
          cp "Vulnerability Test Results/endpoint-inventory.xlsx" test-excel-reports/5_API_Endpoint_Inventory.xlsx

          echo "Excel Reports ready for artifact upload:"
          ls -la test-excel-reports/

      # =======================================================================
      # UPLOAD ARTIFACTS: ALL-IN-ONE BUNDLE (PRIMARY DOWNLOAD)
      # =======================================================================
      - name: "9. Upload Artifact: All Test Excel Reports (Single Download)"
        uses: actions/upload-artifact@v4
        with:
          name: all-test-excel-reports
          path: test-excel-reports/*.xlsx
          retention-days: 30
          if-no-files-found: error

      # =======================================================================
      # UPLOAD ARTIFACTS: INDIVIDUAL SUITE REPORTS (OPTIONAL MODULAR DOWNLOADS)
      # =======================================================================
      - name: "10. Upload Artifact: 1. Selenium Web E2E Report (.xlsx)"
        uses: actions/upload-artifact@v4
        with:
          name: 1-selenium-web-e2e-report
          path: selenium-tests/Selenium_Login_E2E_Test_Report.xlsx
          retention-days: 30

      - name: "11. Upload Artifact: 2. Appium Mobile E2E Report (.xlsx)"
        uses: actions/upload-artifact@v4
        with:
          name: 2-appium-mobile-e2e-report
          path: appium-tests/Appium_Mobile_E2E_Test_Report.xlsx
          retention-days: 30

      - name: "12. Upload Artifact: 3. Baseline Load Test Report (.xlsx)"
        uses: actions/upload-artifact@v4
        with:
          name: 3-baseline-load-test-report
          path: load-tests/Baseline_Load_Test_Report.xlsx
          retention-days: 30

      - name: "13. Upload Artifact: 4. Security Findings & Inventory (.xlsx)"
        uses: actions/upload-artifact@v4
        with:
          name: 4-security-audit-reports
          path: |
            Vulnerability Test Results/findings.xlsx
            Vulnerability Test Results/endpoint-inventory.xlsx
          retention-days: 30

      # =======================================================================
      # STEP SUMMARY FOR GITHUB ACTIONS DASHBOARD
      # =======================================================================
      - name: "14. Publish Execution Summary to GitHub Actions Summary"
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 📊 Automated All-Tests Execution & Excel Reports Summary

          All 4 core test automation suites completed successfully. All Excel workbooks have been archived as downloadable workflow artifacts.

          ### 📑 Test Suites & Generated Excel Artifacts

          | # | Test Suite | Framework / Tool | Test Cases / Metrics | Generated Excel Artifact | Download Package |
          | :-: | :--- | :--- | :---: | :--- | :--- |
          | **1** | **Web Frontend E2E** | Selenium WebDriver | **325 Test Cases** | `1_Selenium_Login_E2E_Test_Report.xlsx` | `all-test-excel-reports` |
          | **2** | **Mobile App E2E** | Appium / React Native | **333 Test Cases** | `2_Appium_Mobile_E2E_Test_Report.xlsx` | `all-test-excel-reports` |
          | **3** | **Baseline Load Test** | 100 VUs Load Engine | **~120 RPS / 60s Run** | `3_Baseline_Load_Test_Report.xlsx` | `all-test-excel-reports` |
          | **4** | **Security & DevSecOps** | SAST / DAST / OWASP | **316 Test Cases** | `4_Security_Vulnerability_Findings.xlsx`<br>`5_API_Endpoint_Inventory.xlsx` | `all-test-excel-reports` |

          ---

          ### 📥 How to Download the Excel Reports
          1. Navigate to the **Summary** tab of this GitHub Actions run.
          2. Scroll down to the **Artifacts** section at the bottom.
          3. Click on **`all-test-excel-reports`** to download all 5 Excel files bundled into a single ZIP archive.
          4. Alternatively, click any individual artifact (`1-selenium-web-e2e-report`, `2-appium-mobile-e2e-report`, `3-baseline-load-test-report`, or `4-security-audit-reports`) for standalone review.
          EOF
